---
# Input for the RPM lockfile generator. See tools/rpm-lockfile/README.md.
#
# This file is hand written and must stay in step with the dnf install step
# in the Containerfile beside it. The generator resolves these names into
# rpms.lock.yaml, which pins every RPM and its dependencies by URL and
# checksum so the build can run with no network.
#
# Regenerate after changing anything here, after moving the base image to a
# new RHEL minor version, or after adding an architecture.
#
# images/operator/rpms.in.yaml is a copy of this file, and the lockfile
# beside it a copy of this one's. The wasm-builder stage in
# images/operator/Containerfile compiles the same envoy-coraza module from
# the same base image with the same package set, so that the module can be
# embedded into the manager binary.
#
# Nothing enforces that the two stay identical. When editing this file:
#
#   - make the same edit to images/operator/rpms.in.yaml, EXCEPT the
#     stageName under context.containerfile, which differs by design
#     ("builder" here, "wasm-builder" there);
#   - regenerate both lockfiles;
#   - build both images.

contentOrigin:
  repofiles:
    # Public UBI content, copied verbatim out of the base image. Supplies
    # rust-toolset, gcc and git.
    - ./ubi.repo
    # Entitled RHEL content, generated by subscription-manager during the
    # one-time bootstrap. Supplies rust-std-static-wasm32-wasip1, which is
    # absent from the public repositories.
    - ./redhat.repo

# Resolve against the packages already present in the base image, so the
# lockfile contains only what the install step actually adds. Reading the
# base out of the Containerfile keeps it named in one place.
#
# stageName is required, not decoration. Given a plain file the generator
# takes the LAST stage, which here is "FROM scratch" - it then tries to
# inspect an image called "scratch" and dies. The packages are installed in
# the builder stage, so that is the stage to resolve against.
context:
  containerfile:
    file: ./Containerfile
    stageName: builder

# The module this produces is architecture independent - it is WebAssembly
# - but the toolchain that compiles it is not, so the RPMs are resolved per
# architecture.
#
# Listing an architecture here costs nothing but lockfile size and does not
# require a machine of that architecture: the solve reads per-arch
# repository metadata, and the base image is inspected through the matching
# entry in its manifest list. Nothing of that architecture is executed.
#
# Note the Component still builds x86_64 only. Resolving aarch64 here is
# what makes turning that on a pipeline change rather than a lockfile
# regeneration under time pressure.
#
# Regenerate the lockfile after changing this list.
arches:
  - x86_64
  - aarch64

# Exactly the set installed by the Containerfile, with TARGET expanded.
# Deliberately smaller than comparable Rust wasm builds: envoy-coraza pulls
# in neither protobuf nor OpenSSL, so the compilers and development headers
# those require are not needed.
packages:
  # The Rust compiler and cargo.
  - rust-toolset
  # The cross-compilation standard library for the wasm target. Without it
  # cargo cannot build for wasm32-wasip1 at all: rustc still names the
  # target in --print target-list, but the build fails for want of a
  # precompiled std. This is the package that forces the entitlement.
  - rust-std-static-wasm32-wasip1
  # cargo needs a host linker driver for build scripts.
  - gcc
  # The dependency set includes a git source.
  - git
