apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/networking-incubator/build-waf?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "pull_request" && target_branch == "main" &&
      ( "images/operator/***".pathChanged() ||
      "coraza-kubernetes-operator".pathChanged() ||
      "coraza-kubernetes-operator/***".pathChanged() ||
      "coraza-rs".pathChanged() ||
      "hack/stage-wasm-module.sh".pathChanged() ||
      ".tekton/waf-operator-0-7-***".pathChanged() )
  labels:
    appstudio.openshift.io/application: waf-0-7
    appstudio.openshift.io/component: waf-operator-0-7
    pipelines.appstudio.openshift.io/type: build
  name: waf-operator-0-7-on-pull-request
  namespace: waf-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads-stage/waf-tenant/waf-0-7/waf-operator:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  # Must match the push pipeline. Building only one architecture here would
  # let an architecture-specific failure through to main.
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/arm64
  - name: dockerfile
    value: images/operator/Containerfile
  # Keep in step with the push pipeline, or a hermetic failure first appears
  # after merge instead of on the pull request.
  - name: hermetic
    value: "true"
  # Must match the push pipeline. See the comment there.
  #
  #   gomod   coraza-kubernetes-operator   reads go.mod
  #   rpm     images/operator              reads rpms.lock.yaml
  #   cargo   coraza-rs                    reads Cargo.lock
  - name: prefetch-input
    value: '[{"type": "gomod", "path": "coraza-kubernetes-operator"}, {"type": "rpm", "path": "images/operator"}, {"type": "cargo", "path": "coraza-rs"}]'
  - name: build-source-image
    value: "true"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: pathInRepo
      value: .tekton/pipelines/docker-build-multi-platform-oci-ta.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-waf-operator-0-7
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
