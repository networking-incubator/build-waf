apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/networking-incubator/build-waf?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "pull_request" && target_branch == "main" &&
      ( "images/bundle/***".pathChanged() ||
      ".tekton/waf-operator-bundle-0-7-***".pathChanged() )
  labels:
    appstudio.openshift.io/application: waf-0-7
    appstudio.openshift.io/component: waf-operator-bundle-0-7
    pipelines.appstudio.openshift.io/type: build
  name: waf-operator-bundle-0-7-on-pull-request
  namespace: waf-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads-stage/waf-tenant/waf-0-7/waf-operator-bundle:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: images/bundle/Containerfile
  # Keep in step with the push pipeline, or a hermetic failure first appears
  # after merge instead of on the pull request.
  - name: hermetic
    value: "true"
  - name: build-source-image
    value: "true"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: pathInRepo
      value: .tekton/pipelines/docker-build-oci-ta.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-waf-operator-bundle-0-7
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
