apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/networking-incubator/build-waf?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "push" && target_branch == "main" &&
      ( "images/operator/***".pathChanged() ||
      "coraza-kubernetes-operator".pathChanged() ||
      "coraza-kubernetes-operator/***".pathChanged() ||
      "coraza-rs".pathChanged() ||
      "hack/stage-wasm-module.sh".pathChanged() ||
      ".tekton/waf-operator-0-7-***".pathChanged() )
  labels:
    appstudio.openshift.io/application: waf-0-7
    appstudio.openshift.io/component: waf-operator-0-7
    pipelines.appstudio.openshift.io/type: build
  name: waf-operator-0-7-on-push
  namespace: waf-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads-stage/waf-tenant/waf-0-7/waf-operator:{{revision}}
  # The operator is the only component whose binary is architecture specific,
  # so it is the only one built for more than one platform. The plugin is
  # WebAssembly, the bundle and the plugin image are FROM scratch, and the
  # toolchain image only has to run where the plugin is compiled.
  #
  # Both base images are pinned to manifest lists covering these platforms,
  # so the digests resolve per architecture and need no change here. The
  # build itself is already architecture parametric via TARGETOS/TARGETARCH.
  #
  # If a build runs out of resources, the replacement for linux/arm64 is
  # linux-m2xlarge/arm64 - a larger host, not an additional one.
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/arm64
  - name: dockerfile
    value: images/operator/Containerfile
  # Network-isolated build. Hermeto resolves every dependency up front; the
  # build then runs with no network.
  - name: hermetic
    value: "true"
  # Three package managers, because the image is built from three sources:
  # the operator's Go module, the Rust workspace that produces the embedded
  # wasm module, and the RPMs the Rust toolchain needs. Paths are relative to
  # the repository root.
  #
  #   gomod   coraza-kubernetes-operator   reads go.mod
  #   rpm     images/operator              reads rpms.lock.yaml
  #   cargo   coraza-rs                    reads Cargo.lock
  #
  # Each prefetch input sits beside the thing it describes: the RPM lockfile
  # next to the Containerfile that installs those packages, Cargo.lock and
  # go.mod at the roots of their source submodules.
  #
  # images/operator/rpms.lock.yaml is a copy of images/coraza-wasm's, because
  # the wasm-builder stage here installs the same package set from the same
  # base image. Nothing enforces that they stay identical - see the header of
  # images/operator/rpms.in.yaml for what to do when either changes.
  - name: prefetch-input
    value: '[{"type": "gomod", "path": "coraza-kubernetes-operator"}, {"type": "rpm", "path": "images/operator"}, {"type": "cargo", "path": "coraza-rs"}]'
  # Produces the source container the release policy requires.
  - name: build-source-image
    value: "true"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: pathInRepo
      value: .tekton/pipelines/docker-build-multi-platform-oci-ta.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-waf-operator-0-7
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
